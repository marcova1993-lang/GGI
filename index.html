<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1f6feb" />
  <title>Cassa Griglia</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🔥 Cassa Griglia</div>
    <div class="conn" id="connStatus" title="Stato connessione">●</div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="cassa">Cassa</button>
    <button class="tab" data-view="cucina">Cucina</button>
    <button class="tab" data-view="impostazioni">⚙︎</button>
  </nav>

  <main>
    <!-- ============ CASSA ============ -->
    <section id="view-cassa" class="view active">
      <div id="cassaList" class="item-list"></div>

      <div class="cassa-total">
        <span>TOTALE</span>
        <span id="cassaTotal" class="total-amount">Fr. 0.00</span>
      </div>

      <div class="pay-panel">
        <div class="pay-label">Il cliente paga:</div>
        <div class="quick-pay" id="quickPay">
          <button data-amount="10">10</button>
          <button data-amount="20">20</button>
          <button data-amount="50">50</button>
          <button data-amount="100">100</button>
          <button data-amount="200">200</button>
        </div>
        <div class="pay-row">
          <input type="number" id="paidInput" inputmode="decimal" placeholder="Altro importo…" min="0" step="0.05" />
          <div class="change-box">
            <span>RESTO</span>
            <span id="changeAmount" class="change-amount">Fr. 0.00</span>
          </div>
        </div>
        <div id="changeTable" class="change-table"></div>
      </div>

      <div class="cassa-actions">
        <button id="resetOrderBtn" class="btn btn-grey">↺ Azzera</button>
        <button id="confirmOrderBtn" class="btn btn-green">✓ Conferma ordine</button>
      </div>
      <div id="cassaMsg" class="msg"></div>
    </section>

    <!-- ============ CUCINA ============ -->
    <section id="view-cucina" class="view">
      <div class="stock-overview" id="stockOverview"></div>
      <h3 class="section-title">Ordini da preparare</h3>
      <div id="ordersList" class="orders-list"></div>
    </section>

    <!-- ============ IMPOSTAZIONI ============ -->
    <section id="view-impostazioni" class="view">
      <h3 class="section-title">Listino e scorte</h3>
      <div id="settingsList" class="settings-list"></div>
      <button id="addItemBtn" class="btn btn-grey full">+ Aggiungi articolo</button>

      <h3 class="section-title">Gestione giornata</h3>
      <button id="resetSoldBtn" class="btn btn-orange full">↻ Azzera vendite (nuova giornata)</button>
      <button id="clearOrdersBtn" class="btn btn-grey full">🗑 Svuota ordini cucina</button>

      <h3 class="section-title">Connessione</h3>
      <p id="backendInfo" class="hint"></p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
