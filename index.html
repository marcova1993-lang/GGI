<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1f7a3d" />
  <title>Cassa Griglia</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="logo.png" alt="GGI"
           onerror="this.onerror=null;this.src='logo.svg'">
      <div class="brand-txt">
        <span class="brand-title">Gruppo Giovani Iragna</span>
        <span class="brand-event" id="brandEvent"></span>
      </div>
    </div>
    <div class="topright">
      <span id="userEmail" class="user-email"></span>
      <button id="authBtn" class="auth-btn">Accedi</button>
      <span class="conn" id="connStatus" title="Stato connessione">●</span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="cassa">Cassa</button>
    <button class="tab" data-view="cucina">Cucina</button>
    <button class="tab" data-view="impostazioni">⚙︎</button>
  </nav>

  <main>
    <!-- ============ CASSA ============ -->
    <section id="view-cassa" class="view active">
      <div id="cassaList" class="item-list"></div>

      <div class="cassa-total">
        <span>TOTALE</span>
        <span id="cassaTotal" class="total-amount">Fr. 0.00</span>
      </div>

      <div class="pay-panel" id="payPanel">
        <div class="pay-label" id="payLabel">Resto da dare se il cliente paga con:</div>
        <div id="changePreview" class="change-table"></div>
      </div>

      <div class="cassa-actions">
        <button id="resetOrderBtn" class="btn btn-grey">↺ Azzera</button>
        <button id="confirmOrderBtn" class="btn btn-green">✓ Conferma</button>
      </div>
      <div id="cassaMsg" class="msg"></div>
    </section>

    <!-- ============ CUCINA ============ -->
    <section id="view-cucina" class="view">
      <h3 class="section-title">Preparazione</h3>
      <div class="prep-list" id="prepList"></div>

      <h3 class="section-title">Storico ordinazioni</h3>
      <div id="historyList" class="orders-list"></div>
    </section>

    <!-- ============ IMPOSTAZIONI ============ -->
    <section id="view-impostazioni" class="view">
      <h3 class="section-title">Listino e scorte</h3>
      <div id="settingsList" class="settings-list"></div>
      <button id="addItemBtn" class="btn btn-grey full">+ Aggiungi articolo</button>

      <h3 class="section-title">Evento</h3>
      <input id="eventNameInput" class="event-input" placeholder="Nome evento (es. Maccabei 2026)" />
      <button id="newEventBtn" class="btn btn-orange full">↻ Nuovo evento (azzera vendite)</button>
      <button id="clearOrdersBtn" class="btn btn-grey full">🗑 Svuota storico ordinazioni</button>

      <h3 class="section-title">Log attività</h3>
      <div id="logList" class="log-list"></div>
      <button id="clearLogBtn" class="btn btn-grey full">🗑 Svuota log</button>

      <h3 class="section-title">Connessione</h3>
      <p id="backendInfo" class="hint"></p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
