name: Deploy su GitHub Pages

on:
  push:
    branches: ["claude/charming-faraday-f4osoe", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola distribuzione alla volta
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Carica il sito (file statici nella radice)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
